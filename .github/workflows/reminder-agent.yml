name: Driver Pickup Reminder Agent

# Runs the agent in the cloud on a schedule, so reminders fire even when your
# laptop is off. The "Sent" status is written to the Google Sheet, so it
# persists between runs (GitHub runners are ephemeral).
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_PHONE_NUMBER,
#   RENDER_WEBHOOK_URL, GOOGLE_SHEET_ID,
#   GOOGLE_SERVICE_ACCOUNT_JSON  (paste the whole service-account JSON)

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 min (UTC). The 25–35 min window is caught.
  workflow_dispatch:          # allow manual runs from the Actions tab

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account credentials
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Run one reminder cycle
        run: python agent.py --once
        env:
          SHEET_BACKEND: google
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          RENDER_WEBHOOK_URL: ${{ secrets.RENDER_WEBHOOK_URL }}
